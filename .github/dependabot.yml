version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  # Dependabot PRs need no linked issue; none of these change the plugin zip
  # unless build/ changes, so they normally make no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # npm packages, once a month:
  # - Foldbox (the lightbox that ships in the plugin) gets its own PR. CI then
  #   fails until the shipped copy is updated: check out the PR's branch, run
  #   `npm ci && npm run vendor:foldbox`, and commit the result to it. Merging
  #   it changes the plugin zip, so it makes a release.
  # - Dev tools (@wordpress/scripts and friends) come in one grouped PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      foldbox:
        patterns: ['foldbox']
      npm:
        patterns: ['*']
        exclude-patterns: ['foldbox']
    commit-message:
      prefix: build
    labels:
      - dependencies

  # Dev tools from composer.json (PHPCS, PHPStan, PHPUnit), one grouped PR a month.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ['*']
    commit-message:
      prefix: build
    labels:
      - dependencies
